# Random Forest configuration for PathSnap candidate scoring.
# Family: Tree ensemble (bagging)
# Owner: Member C

model_name: RandomForest
algorithm_family: tree ensemble (bagging)

params:
  n_estimators: 20
  max_depth: 10
  min_samples_split: 4
  min_samples_leaf: 5
  max_features: sqrt
  max_samples: 0.5
  class_weight: balanced_subsample
  bootstrap: true
  n_jobs: -1
  random_state: 42

preprocessing:
  imputation: median
objective: Gini impurity reduction at each split; class probabilities aggregated across trees
