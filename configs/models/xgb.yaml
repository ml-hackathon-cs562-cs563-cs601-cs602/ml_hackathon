# XGBoost configuration for PathSnap candidate scoring.
# Family: Boosting (level-wise gradient boosted trees)

model_name: XGBoost
algorithm_family: boosting (level-wise gradient boosted trees)

params:
  n_estimators: 400
  learning_rate: 0.03364
  max_depth: 10
  min_child_weight: 46.735
  subsample: 0.8847
  colsample_bytree: 0.642
  reg_lambda: 0.00156
  gamma: 1.845
  tree_method: hist
  random_state: 42
  verbosity: 0
  n_jobs: 2
